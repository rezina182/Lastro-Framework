name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Testes
        run: npm test
      - name: Validar catalogo
        run: npm run catalog:validate
      - name: Conferir mapa ASVS contra o CSV oficial (tag e checksum fixos)
        run: |
          set -euo pipefail
          SHA256=98c8fe911b9edb403af8ee05d3ce8201ecac2659e313b053890a62847cdcf680
          curl -sSfL -o "${RUNNER_TEMP}/asvs.csv" "https://raw.githubusercontent.com/OWASP/ASVS/v5.0.0/5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.csv"
          echo "${SHA256}  ${RUNNER_TEMP}/asvs.csv" | sha256sum -c -
          node verifier/bin/lastro.js asvs verify --csv "${RUNNER_TEMP}/asvs.csv"
      - name: LASTRO no proprio repositorio
        run: node verifier/bin/lastro.js check --allow-incomplete
      - name: Auditoria de dependencias
        run: npm audit --audit-level=high
      - name: Varredura de segredos (gitleaks, versao e checksum fixos)
        run: |
          set -euo pipefail
          VERSION=8.24.2
          SHA256=fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .
